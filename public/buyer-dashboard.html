<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Dashboard - CropLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="buyer-dashboard.html" class="logo">🌾 CropLink</a>
        <ul class="nav-links" id="navLinks"></ul>
    </nav>

    <main class="container">
        <div class="welcome-card">
            <h2>🛒 Buyer Dashboard</h2>
            <p>Welcome back, <strong id="buyerName">Buyer</strong>! Explore fresh farm products and track your orders below.</p>

            <div class="dashboard-grid" style="margin-top: 2rem;">
                <a href="products.html" class="dashboard-card">
                    <div class="dashboard-icon">🌿</div>
                    <div class="dashboard-label">Browse Market</div>
                    <div class="dashboard-sub">Explore available farm products</div>
                </a>
                <a href="buyer-orders.html" class="dashboard-card">
                    <div class="dashboard-icon">📦</div>
                    <div class="dashboard-label">My Orders</div>
                    <div class="dashboard-sub">Track your placed orders</div>
                </a>
            </div>

            <div style="margin-top: 2rem;">
                <button onclick="logout()" class="btn btn-danger">🚪 Logout</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CropLink | College Project Demonstration</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/buyer.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initBuyerDashboard();
        });
    </script>
</body>
</html>
