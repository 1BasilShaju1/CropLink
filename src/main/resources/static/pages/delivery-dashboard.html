<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Dashboard — CropLink</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#f0f4f0;font-family:'Poppins',sans-serif}
.dash-layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:linear-gradient(180deg,#1b5e20,#2e7d32);color:#fff;position:fixed;top:0;left:0;height:100vh;padding:0;z-index:100}
.sidebar .logo{padding:22px 18px;font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:13px 18px;color:rgba(255,255,255,.85);text-decoration:none;transition:.2s;font-size:.92rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.15);color:#fff;border-left:3px solid #a5d6a7}
.sidebar nav a i{width:20px;text-align:center}
.main-content{margin-left:230px;flex:1;padding:28px}
.page-header{margin-bottom:24px}
.page-header h1{font-size:1.5rem;font-weight:700;color:#1b5e20}
.page-header p{color:#666;font-size:.9rem;margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:4px solid #4caf50;display:flex;align-items:center;gap:14px}
.stat-icon{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:#e8f5e9;color:#2e7d32}
.stat-info h3{font-size:1.5rem;font-weight:700;color:#1b5e20;line-height:1}
.stat-info p{font-size:.8rem;color:#777;margin-top:3px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:24px}
.card-title{font-size:1.1rem;font-weight:700;color:#1b5e20;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.tab-bar{display:flex;gap:8px;margin-bottom:20px}
.tab-btn{padding:9px 20px;border:none;background:#f5f5f5;cursor:pointer;font-size:.9rem;border-radius:8px;transition:.2s;font-family:inherit;color:#555}
.tab-btn.active{background:#2e7d32;color:#fff}
.order-card{border:1px solid #e8f5e9;border-radius:12px;padding:18px;margin-bottom:14px;transition:.2s}
.order-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:#a5d6a7}
.order-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.order-id{font-weight:700;color:#1b5e20;font-size:1rem}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:600}
.badge-PENDING{background:#fff3e0;color:#e65100}
.badge-ACCEPTED{background:#e3f2fd;color:#1565c0}
.badge-PACKED{background:#f3e5f5;color:#6a1b9a}
.badge-OUT_FOR_DELIVERY{background:#e0f2f1;color:#00695c}
.badge-DELIVERED{background:#e8f5e9;color:#2e7d32}
.badge-CANCELLED{background:#ffebee;color:#c62828}
.order-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.87rem;color:#555;margin-bottom:12px}
.order-details span{display:flex;gap:6px;align-items:center}
.order-details i{color:#4caf50;width:16px}
.order-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;transition:.2s;font-family:inherit}
.btn-primary{background:#4caf50;color:#fff}.btn-primary:hover{background:#388e3c}
.btn-outline{background:transparent;border:1px solid #4caf50;color:#2e7d32}.btn-outline:hover{background:#e8f5e9}
.btn-delivered{background:#2196f3;color:#fff}.btn-delivered:hover{background:#1565c0}
.empty-state{text-align:center;padding:50px;color:#aaa}
.empty-state i{font-size:3rem;margin-bottom:14px;display:block}
@media(max-width:768px){.sidebar{width:56px}.sidebar .logo span,.sidebar nav a span{display:none}.main-content{margin-left:56px;padding:14px}}
</style>
</head>
<body>
<div class="dash-layout">
  <aside class="sidebar">
    <div class="logo"><i class="fas fa-truck"></i><span>CropLink</span></div>
    <nav>
      <a href="#" class="active" onclick="switchTab('my-deliveries',this)"><i class="fas fa-route"></i><span>My Deliveries</span></a>
      <a href="#" onclick="switchTab('available',this)"><i class="fas fa-box-open"></i><span>Available</span></a>
      <a href="/pages/profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
      <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 id="page-title"><i class="fas fa-route"></i> My Deliveries</h1>
      <p id="dp-name">Welcome back!</p>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-box"></i></div><div class="stat-info"><h3 id="s-total">0</h3><p>Total Deliveries</p></div></div>
      <div class="stat-card" style="border-color:#2196f3"><div class="stat-icon" style="background:#e3f2fd;color:#1565c0"><i class="fas fa-truck-moving"></i></div><div class="stat-info"><h3 id="s-active">0</h3><p>Active</p></div></div>
      <div class="stat-card" style="border-color:#43a047"><div class="stat-icon" style="background:#e8f5e9;color:#2e7d32"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3 id="s-delivered">0</h3><p>Delivered</p></div></div>
    </div>

    <!-- My Deliveries -->
    <div id="tab-my-deliveries" class="tab-content-panel active">
      <div class="card">
        <div class="card-title"><i class="fas fa-route"></i> My Active Deliveries</div>
        <div id="my-deliveries-list"><div class="empty-state"><i class="fas fa-truck"></i>No deliveries yet</div></div>
      </div>
    </div>

    <!-- Available Pickups -->
    <div id="tab-available" class="tab-content-panel" style="display:none">
      <div class="card">
        <div class="card-title"><i class="fas fa-box-open"></i> Available for Pickup (Packed Orders)</div>
        <div id="available-list"><div class="empty-state"><i class="fas fa-box"></i>No available pickups</div></div>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/effects.js"></script>
<script>
function showToast(msg, type = 'info') {
  if (window.Toast) {
    if (type === 'success' && Toast.success) return Toast.success(msg);
    if (type === 'error' && Toast.error) return Toast.error(msg);
    if (type === 'warning' && Toast.warning) return Toast.warning(msg);
    if (Toast.info) return Toast.info(msg);
  }
  const t = document.getElementById('toast');
  if (t) {
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => { t.className = 'toast'; }, 3000);
  } else {
    alert(msg);
  }
}

if (!Api.isLoggedIn() || Api.getUserRole() !== 'DELIVERY_PARTNER') {
  window.location.href = '/pages/login.html';
}
const user = Api.getUser();
document.getElementById('dp-name').textContent = '👋 Welcome, ' + (user?.fullName || '');

function switchTab(tab, el) {
  document.querySelectorAll('.tab-content-panel').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = 'block';
  if (el) el.classList.add('active');
  const titles = {'my-deliveries': 'My Deliveries', 'available': 'Available Pickups'};
  document.getElementById('page-title').innerHTML = '<i class="fas fa-route"></i> ' + (titles[tab] || tab);
  if (tab === 'available') loadAvailable();
  else if (tab === 'my-deliveries') loadMyDeliveries();
}

async function loadMyDeliveries() {
  try {
    const res = await Api.get('/api/delivery/orders?page=0&size=50');
    const orders = res.data?.content || (Array.isArray(res.data) ? res.data : []);
    const activeOrders = orders.filter(o => o.orderStatus === 'OUT_FOR_DELIVERY');
    const deliveredOrders = orders.filter(o => o.orderStatus === 'DELIVERED');
    document.getElementById('s-total').textContent = orders.length;
    document.getElementById('s-active').textContent = activeOrders.length;
    document.getElementById('s-delivered').textContent = deliveredOrders.length;

    const list = document.getElementById('my-deliveries-list');
    if (!orders.length) { list.innerHTML = '<div class="empty-state"><i class="fas fa-truck"></i>No deliveries yet</div>'; return; }
    list.innerHTML = orders.map(o => renderOrderCard(o, true)).join('');
  } catch(e) { showToast('Failed to load deliveries: ' + (e.message || ''), 'error'); }
}

async function loadAvailable() {
  try {
    const res = await Api.get('/api/delivery/available?page=0&size=50');
    const orders = res.data?.content || (Array.isArray(res.data) ? res.data : []);
    const list = document.getElementById('available-list');
    if (!orders.length) { list.innerHTML = '<div class="empty-state"><i class="fas fa-box"></i>No orders ready for pickup</div>'; return; }
    list.innerHTML = orders.map(o => `
      <div class="order-card">
        <div class="order-header">
          <span class="order-id">Order #${o.id}</span>
          <span class="badge badge-PACKED">PACKED - Ready</span>
        </div>
        <div class="order-details">
          <span><i class="fas fa-user"></i>${o.customerName}</span>
          <span><i class="fas fa-rupee-sign"></i>₹${o.finalAmount}</span>
          <span><i class="fas fa-map-marker-alt"></i>${o.deliveryAddress || 'Not specified'}</span>
          <span><i class="fas fa-calendar"></i>${new Date(o.orderDate).toLocaleDateString('en-IN')}</span>
        </div>
        <div class="order-actions">
          <button class="btn btn-primary" onclick="acceptDelivery(${o.id})"><i class="fas fa-hand-point-right"></i> Accept Delivery</button>
        </div>
      </div>`).join('');
  } catch(e) { showToast('Failed to load available orders', 'error'); }
}

function renderOrderCard(o, showActions) {
  const canMarkDelivered = o.orderStatus === 'OUT_FOR_DELIVERY';
  return `
    <div class="order-card">
      <div class="order-header">
        <span class="order-id">Order #${o.id}</span>
        <span class="badge badge-${o.orderStatus}">${o.orderStatus.replace(/_/g,' ')}</span>
      </div>
      <div class="order-details">
        <span><i class="fas fa-user"></i>${o.customerName}</span>
        <span><i class="fas fa-rupee-sign"></i>₹${o.finalAmount}</span>
        <span><i class="fas fa-map-marker-alt"></i>${o.deliveryAddress || 'Not specified'}</span>
        <span><i class="fas fa-calendar"></i>${new Date(o.orderDate).toLocaleDateString('en-IN')}</span>
      </div>
      ${showActions && canMarkDelivered ? `
      <div class="order-actions">
        <button class="btn btn-delivered" onclick="markDelivered(${o.id})"><i class="fas fa-check"></i> Mark Delivered</button>
      </div>` : ''}
    </div>`;
}

async function acceptDelivery(orderId) {
  try {
    await Api.post(`/api/delivery/orders/${orderId}/accept`, {});
    showToast('Delivery accepted! It is now in your dashboard.', 'success');
    loadAvailable();
    loadMyDeliveries();
  } catch(e) { showToast(e.message, 'error'); }
}

async function markDelivered(orderId) {
  if (!confirm('Mark this order as delivered?')) return;
  try {
    await Api.patch(`/api/delivery/orders/${orderId}/status`, { status: 'DELIVERED' });
    showToast('Order marked as delivered!', 'success');
    loadMyDeliveries();
  } catch(e) { showToast(e.message, 'error'); }
}

function logout() { Api.clearAuth(); window.location.href = '/pages/login.html'; }
loadMyDeliveries();
</script>
</body>
</html>
