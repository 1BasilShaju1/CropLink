<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Crop Marketplace | CropLink Farm2Door</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .market-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2rem;
            padding: 2.5rem 0;
        }
        .filter-sidebar {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 90px;
        }
        .category-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .category-chip:hover {
            background: var(--primary-subtle);
            color: var(--primary);
        }
        .category-chip.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }
        .category-chip.active .chip-count {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }
        .chip-count {
            font-size: 0.75rem;
            background: var(--bg-alt);
            padding: 0.15rem 0.5rem;
            border-radius: var(--radius-full);
            color: var(--text-muted);
        }
        @media (max-width: 900px) {
            .market-layout {
                grid-template-columns: 1fr;
            }
            .filter-sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>

    <div class="page-transition-overlay"></div>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/index.html" class="navbar-brand">
                <i class="fa-solid fa-leaf"></i>
                <span>CropLink</span>
                <span class="brand-badge">Market</span>
            </a>

            <nav class="navbar-nav">
                <a href="/index.html" class="nav-link">Home</a>
                <a href="/pages/products.html" class="nav-link active">Marketplace</a>
                <a href="/pages/customer-orders.html" class="nav-link">My Orders</a>
            </nav>

            <div class="navbar-actions">
                <a href="/pages/cart.html" class="cart-btn-pill" title="View Cart">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span>Cart</span>
                    <span class="cart-count">0</span>
                </a>

                <div id="navbar-auth-section">
                    <a href="/pages/login.html" class="btn btn-primary btn-sm">Sign In</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Top Toolbar -->
        <div style="padding-top: 2rem;">
            <div class="card" style="padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                <div class="input-icon-wrap" style="flex: 1; min-width: 280px;">
                    <i class="fa-solid fa-magnifying-glass input-icon"></i>
                    <input type="text" id="search-input" class="form-control" placeholder="Search crops, farms, organic greens, spices...">
                </div>

                <div class="flex items-center gap-2">
                    <label for="sort-select" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap;">Sort By:</label>
                    <select id="sort-select" class="form-control" style="width: auto; min-width: 170px;">
                        <option value="NEWEST">Newest Harvest</option>
                        <option value="PRICE_LOW_HIGH">Price: Low to High</option>
                        <option value="PRICE_HIGH_LOW">Price: High to Low</option>
                        <option value="RATING">Top Rated</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="market-layout">
            <!-- Left Filter Sidebar -->
            <aside class="filter-sidebar">
                <div class="flex items-center justify-between" style="margin-bottom: 1.25rem;">
                    <h3 style="font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-sliders" style="color:var(--primary);"></i> Filters
                    </h3>
                    <button class="btn btn-sm" id="reset-filters" style="font-size: 0.8rem; background:none; border:none; color:var(--primary); padding:0; cursor:pointer;">
                        Reset
                    </button>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <div class="form-label" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">Categories</div>
                    <div class="flex flex-col gap-1" id="category-list">
                        <div class="category-chip active" data-category="ALL">
                            <span>All Harvests</span>
                            <span class="chip-count">8</span>
                        </div>
                        <div class="category-chip" data-category="Vegetables">
                            <span>Vegetables</span>
                            <span class="chip-count">4</span>
                        </div>
                        <div class="category-chip" data-category="Fruits">
                            <span>Fruits</span>
                            <span class="chip-count">2</span>
                        </div>
                        <div class="category-chip" data-category="Grains & Pulses">
                            <span>Grains & Pulses</span>
                            <span class="chip-count">1</span>
                        </div>
                        <div class="category-chip" data-category="Greens & Herbs">
                            <span>Greens & Herbs</span>
                            <span class="chip-count">1</span>
                        </div>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                    <div class="form-label" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">Organic Certification</div>
                    <div class="flex flex-col gap-2">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="filter-organic-only">
                            <span style="font-size: 0.875rem;">100% Organic Only</span>
                        </label>
                    </div>
                </div>

                <div style="border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                    <div class="form-label" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">Max Price: ₹<span id="price-val">500</span></div>
                    <input type="range" id="price-range" min="10" max="600" step="10" value="600" style="width: 100%; accent-color: var(--primary);">
                </div>
            </aside>

            <!-- Product Cards Grid -->
            <div>
                <div class="flex items-center justify-between" style="margin-bottom: 1.25rem;">
                    <div style="font-size: 0.95rem; color: var(--text-secondary);">
                        Showing <strong id="results-count">8</strong> fresh farm crops
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3" id="marketplace-grid">
                    <!-- Products dynamic render -->
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/effects.js"></script>
    <script>
        const catalogProducts = [
            {
                id: 1,
                name: 'Organic Vine-Ripened Tomatoes',
                farmerName: 'Ramesh Patel, Nashik Orchards',
                category: 'Vegetables',
                price: 45,
                unit: 'kg',
                rating: 4.8,
                ratingCount: 32,
                organicStatus: '100% Certified Organic',
                imageUrl: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-14'
            },
            {
                id: 2,
                name: 'Fresh Alphonso Mangoes',
                farmerName: 'Suresh Gaikwad, Ratnagiri Groves',
                category: 'Fruits',
                price: 450,
                unit: 'dozen',
                rating: 4.9,
                ratingCount: 58,
                organicStatus: 'Naturally Grown / Pesticide Free',
                imageUrl: 'https://images.unsplash.com/photo-1553279768-865429fa0078?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-13'
            },
            {
                id: 3,
                name: 'Crisp Palak (Spinach)',
                farmerName: 'Kavita Devi, Meerut Greenery',
                category: 'Greens & Herbs',
                price: 30,
                unit: 'bunch',
                rating: 4.7,
                ratingCount: 19,
                organicStatus: '100% Certified Organic',
                imageUrl: 'https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-14'
            },
            {
                id: 4,
                name: 'Traditional Basmati Rice',
                farmerName: 'Harpreet Singh, Karnal Fields',
                category: 'Grains & Pulses',
                price: 110,
                unit: 'kg',
                rating: 4.9,
                ratingCount: 44,
                organicStatus: 'Naturally Grown / Pesticide Free',
                imageUrl: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-10'
            },
            {
                id: 5,
                name: 'Crisp Red Onions',
                farmerName: 'Bhanudas More, Lasalgaon APMC',
                category: 'Vegetables',
                price: 38,
                unit: 'kg',
                rating: 4.6,
                ratingCount: 27,
                organicStatus: 'Naturally Grown / Pesticide Free',
                imageUrl: 'https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-12'
            },
            {
                id: 6,
                name: 'Farm Sweet Corn Cobs',
                farmerName: 'Naveen Kumar, Mysore Agro',
                category: 'Vegetables',
                price: 25,
                unit: 'piece',
                rating: 4.8,
                ratingCount: 15,
                organicStatus: '100% Certified Organic',
                imageUrl: 'https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-14'
            },
            {
                id: 7,
                name: 'Fresh Nagpur Seedless Oranges',
                farmerName: 'Devendra Bhoyar, Nagpur',
                category: 'Fruits',
                price: 75,
                unit: 'kg',
                rating: 4.7,
                ratingCount: 31,
                organicStatus: 'Naturally Grown / Pesticide Free',
                imageUrl: 'https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5b?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-13'
            },
            {
                id: 8,
                name: 'Farm Fresh Green Capsicum',
                farmerName: 'Shivaji Rao, Satara Polyhouse',
                category: 'Vegetables',
                price: 60,
                unit: 'kg',
                rating: 4.7,
                ratingCount: 22,
                organicStatus: '100% Certified Organic',
                imageUrl: 'https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?w=500&auto=format&fit=crop&q=80',
                harvestDate: '2026-10-14'
            }
        ];

        let selectedCategory = 'ALL';
        let productsList = catalogProducts;

        // Check category query param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('category')) {
            selectedCategory = urlParams.get('category');
        }

        async function fetchProducts() {
            try {
                const res = await Api.get('/api/products');
                if (res && res.data && Array.isArray(res.data) && res.data.length > 0) {
                    productsList = res.data;
                }
            } catch (err) {
                // Fallback to local catalog
            }
            renderMarketplace();
        }

        function renderMarketplace() {
            const grid = document.getElementById('marketplace-grid');
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const sortBy = document.getElementById('sort-select').value;
            const organicOnly = document.getElementById('filter-organic-only').checked;
            const maxPrice = Number(document.getElementById('price-range').value);

            let filtered = productsList.filter(p => {
                const matchesCat = (selectedCategory === 'ALL') || (p.category && p.category.toLowerCase().includes(selectedCategory.toLowerCase()));
                const matchesSearch = p.name.toLowerCase().includes(keyword) || (p.farmerName && p.farmerName.toLowerCase().includes(keyword));
                const matchesOrganic = !organicOnly || (p.organicStatus && p.organicStatus.includes('Organic'));
                const matchesPrice = p.price <= maxPrice;
                return matchesCat && matchesSearch && matchesOrganic && matchesPrice;
            });

            // Sorting
            if (sortBy === 'PRICE_LOW_HIGH') filtered.sort((a,b) => a.price - b.price);
            else if (sortBy === 'PRICE_HIGH_LOW') filtered.sort((a,b) => b.price - a.price);
            else if (sortBy === 'RATING') filtered.sort((a,b) => (b.rating || 0) - (a.rating || 0));

            document.getElementById('results-count').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1.5rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
                        <i class="fa-solid fa-wheat-awn-circle-exclamation" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
                        <h3>No matching fresh produce found</h3>
                        <p style="color: var(--text-muted);">Try adjusting your search filters or price limits</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-card fade-in-up">
                    <div class="product-image-wrap">
                        <img src="${p.imageUrl}" alt="${p.name}" loading="lazy">
                        <div class="product-badges">
                            <span class="badge badge-organic">${p.organicStatus ? p.organicStatus.split(' ')[0] : 'Farm Fresh'}</span>
                        </div>
                    </div>
                    <div class="product-body">
                        <div class="product-farmer">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>${p.farmerName}</span>
                        </div>
                        <a href="/pages/product-details.html?id=${p.id}" class="product-title">${p.name}</a>
                        <div class="product-rating">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star-half-stroke"></i>
                            <span class="rating-num">${p.rating || 4.8} (${p.ratingCount || 20})</span>
                        </div>
                        <div class="product-footer">
                            <div class="product-price">
                                <span class="currency">₹${p.price}</span>
                                <span class="unit">/${p.unit}</span>
                            </div>
                            <button class="btn btn-primary btn-sm add-cart-btn" data-prod='${JSON.stringify(p).replace(/'/g, "&#39;")}'>
                                <i class="fa-solid fa-cart-plus"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            // Add to Cart handlers
            grid.querySelectorAll('.add-cart-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const prod = JSON.parse(btn.getAttribute('data-prod'));
                    Api.cart.addItem(prod, 1);
                });
            });
        }

        // Category selection
        document.querySelectorAll('.category-chip').forEach(chip => {
            const cat = chip.getAttribute('data-category');
            if (cat.toLowerCase() === selectedCategory.toLowerCase()) {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            }

            chip.addEventListener('click', () => {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                selectedCategory = chip.getAttribute('data-category');
                renderMarketplace();
            });
        });

        // Event listeners
        document.getElementById('search-input').addEventListener('input', renderMarketplace);
        document.getElementById('sort-select').addEventListener('change', renderMarketplace);
        document.getElementById('filter-organic-only').addEventListener('change', renderMarketplace);

        const priceRange = document.getElementById('price-range');
        const priceVal = document.getElementById('price-val');
        priceRange.addEventListener('input', (e) => {
            priceVal.textContent = e.target.value;
            renderMarketplace();
        });

        document.getElementById('reset-filters').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            document.getElementById('filter-organic-only').checked = false;
            priceRange.value = 600;
            priceVal.textContent = '600';
            selectedCategory = 'ALL';
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            document.querySelector('.category-chip[data-category="ALL"]').classList.add('active');
            renderMarketplace();
        });

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
