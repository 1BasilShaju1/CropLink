<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Crop Marketplace | CropLink Farm2Door</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .market-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2rem;
            padding: 2.5rem 0;
        }
        .filter-sidebar {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 90px;
        }
        .category-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .category-chip:hover { background: var(--primary-subtle); color: var(--primary); }
        .category-chip.active { background: var(--primary); color: #fff; font-weight: 600; }
        .category-chip.active .chip-count { background: rgba(255,255,255,0.25); color: #fff; }
        .chip-count { font-size: 0.75rem; background: var(--bg-alt); padding: 0.15rem 0.5rem; border-radius: var(--radius-full); color: var(--text-muted); }
        @media (max-width: 900px) {
            .market-layout { grid-template-columns: 1fr; }
            .filter-sidebar { position: static; }
        }
    </style>
<style>
/* ===== MOBILE RESPONSIVENESS ===== */
@media(max-width:768px){
  table { min-width: 500px; }
  .table-wrap, .data-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .grid-cols-4, .grid-cols-3 { grid-template-columns: 1fr 1fr !important; }
  .grid-cols-2 { grid-template-columns: 1fr !important; }
  .dashboard-wrapper { flex-direction: column !important; }
  .dashboard-sidebar { width: 100% !important; flex-direction: row !important; overflow-x: auto; }
  .stats-grid { grid-template-columns: 1fr 1fr !important; }
  .quick-actions { grid-template-columns: 1fr !important; }
}
@media(max-width:480px){
  .grid-cols-4, .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr !important; }
  .stats-grid { grid-template-columns: 1fr !important; }
}
</style></head>
<body>

    <div class="page-transition-overlay"></div>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/index.html" class="navbar-brand">
                <i class="fa-solid fa-leaf"></i>
                <span>CropLink</span>
                <span class="brand-badge">Market</span>
            </a>

            <nav class="navbar-nav">
                <a href="/index.html" class="nav-link">Home</a>
                <a href="/pages/products.html" class="nav-link active">Marketplace</a>
                <a href="/pages/customer-orders.html" class="nav-link">My Orders</a>
            </nav>

            <div class="navbar-actions">
                <a href="/pages/cart.html" class="cart-btn-pill" title="View Cart">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span>Cart</span>
                    <span class="cart-count">0</span>
                </a>
                <div id="navbar-auth-section">
                    <a href="/pages/login.html" class="btn btn-primary btn-sm">Sign In</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Top Toolbar -->
        <div style="padding-top: 2rem;">
            <div class="card" style="padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                <div class="input-icon-wrap" style="flex: 1; min-width: 280px;">
                    <i class="fa-solid fa-magnifying-glass input-icon"></i>
                    <input type="text" id="search-input" class="form-control" placeholder="Search crops, farms, organic greens, spices...">
                </div>

                <div class="flex items-center gap-2">
                    <label for="sort-select" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap;">Sort By:</label>
                    <select id="sort-select" class="form-control" style="width: auto; min-width: 170px;">
                        <option value="">Newest Harvest</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="market-layout">
            <!-- Left Filter Sidebar -->
            <aside class="filter-sidebar">
                <div class="flex items-center justify-between" style="margin-bottom: 1.25rem;">
                    <h3 style="font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-sliders" style="color:var(--primary);"></i> Filters
                    </h3>
                    <button class="btn btn-sm" id="reset-filters" style="font-size: 0.8rem; background:none; border:none; color:var(--primary); padding:0; cursor:pointer;">
                        Reset
                    </button>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <div class="form-label" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">Categories</div>
                    <div class="flex flex-col gap-1" id="category-list">
                        <div class="category-chip active" data-category-id="">
                            <span>All Harvests</span>
                            <span class="chip-count" id="count-all">—</span>
                        </div>
                        <!-- Dynamic categories loaded here -->
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                    <div class="form-label" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">Organic Certification</div>
                    <div class="flex flex-col gap-2">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="filter-organic-only">
                            <span style="font-size: 0.875rem;">100% Organic Only</span>
                        </label>
                    </div>
                </div>

                <div style="border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                    <div class="form-label" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem;">Max Price: ₹<span id="price-val">2000</span></div>
                    <input type="range" id="price-range" min="10" max="2000" step="10" value="2000" style="width: 100%; accent-color: var(--primary);">
                </div>
            </aside>

            <!-- Product Cards Grid -->
            <div>
                <div class="flex items-center justify-between" style="margin-bottom: 1.25rem;">
                    <div style="font-size: 0.95rem; color: var(--text-secondary);">
                        Showing <strong id="results-count">—</strong> fresh farm crops
                    </div>
                    <div id="loading-indicator" style="font-size: 0.85rem; color: var(--text-muted); display:none;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading...
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3" id="marketplace-grid">
                    <!-- Products dynamic render -->
                    <div style="grid-column:1/-1; text-align:center; padding:4rem;">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color:var(--primary);"></i>
                        <p style="margin-top:1rem; color:var(--text-muted);">Loading fresh crops...</p>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination-container" style="display:flex; justify-content:center; gap:0.5rem; margin-top:2rem;"></div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/effects.js"></script>
    <script>
        let allProducts = [];
        let categories = [];
        let selectedCategoryId = '';
        let currentPage = 0;
        let totalPages = 0;
        let totalElements = 0;

        // Check URL params
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('category')) {
            selectedCategoryId = urlParams.get('category');
        }

        async function loadCategories() {
            try {
                const res = await Api.get('/api/categories/public');
                categories = (res && res.data) ? res.data : [];
            } catch(e) {
                categories = [];
            }
            renderCategoryList();
        }

        function renderCategoryList() {
            const list = document.getElementById('category-list');
            const catItems = categories.map(cat => `
                <div class="category-chip ${selectedCategoryId == cat.id ? 'active' : ''}" data-category-id="${cat.id}">
                    <span>${cat.name}</span>
                </div>
            `).join('');
            list.innerHTML = `
                <div class="category-chip ${!selectedCategoryId ? 'active' : ''}" data-category-id="">
                    <span>All Harvests</span>
                    <span class="chip-count" id="count-all">${totalElements || '—'}</span>
                </div>
                ${catItems}
            `;
            // Reattach events
            list.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    list.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    selectedCategoryId = chip.getAttribute('data-category-id') || '';
                    currentPage = 0;
                    fetchProducts();
                });
            });
        }

        async function fetchProducts() {
            document.getElementById('loading-indicator').style.display = 'inline';
            const search = document.getElementById('search-input').value.trim() || null;
            const sort = document.getElementById('sort-select').value || null;
            const catParam = selectedCategoryId ? `&category=${encodeURIComponent(selectedCategoryId)}` : '';
            const searchParam = search ? `&search=${encodeURIComponent(search)}` : '';
            const sortParam = sort ? `&sort=${sort}` : '';
            const url = `/api/products/public?page=${currentPage}&size=12${catParam}${searchParam}${sortParam}`;

            try {
                const res = await Api.get(url);
                const pageData = res && res.data ? res.data : {};
                allProducts = Array.isArray(pageData) ? pageData : (pageData.content || []);
                totalPages = pageData.totalPages || 1;
                totalElements = pageData.totalElements !== undefined ? pageData.totalElements : allProducts.length;
            } catch(e) {
                console.error('Failed to fetch products:', e);
                allProducts = [];
                totalPages = 0;
                totalElements = 0;
            }

            document.getElementById('loading-indicator').style.display = 'none';
            renderMarketplace();
            renderPagination();
            // Update "all" count chip
            const countEl = document.getElementById('count-all');
            if (countEl) countEl.textContent = totalElements;
        }

        function renderMarketplace() {
            const grid = document.getElementById('marketplace-grid');
            const organicOnly = document.getElementById('filter-organic-only').checked;
            const maxPrice = Number(document.getElementById('price-range').value);

            let filtered = allProducts.filter(p => {
                const matchesOrganic = !organicOnly || (p.organicStatus && String(p.organicStatus).toLowerCase().includes('organic'));
                const matchesPrice = Number(p.price || 0) <= maxPrice;
                return matchesOrganic && matchesPrice;
            });

            document.getElementById('results-count').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1.5rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
                        <i class="fa-solid fa-wheat-awn-circle-exclamation" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
                        <h3>No fresh produce found</h3>
                        <p style="color: var(--text-muted);">Try adjusting your search filters or price limits</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const imageUrl = p.primaryImageUrl || (p.imageUrls && p.imageUrls[0]) || 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400&auto=format&fit=crop&q=80';
                const rating = Number(p.averageRating) || 4.5;
                const reviews = Number(p.totalReviews) || 0;
                const stars = generateStars(rating);
                const organic = (typeof p.organicStatus === 'string') ? p.organicStatus : 'Farm Fresh';
                const organicLabel = organic.split(' ')[0];
                const price = Number(p.price || 0);
                return `
                    <div class="product-card visible fade-in-up">
                        <div class="product-image-wrap">
                            <img src="${imageUrl}" alt="${p.name || 'Crop'}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400&auto=format&fit=crop&q=80'">
                            <div class="product-badges">
                                <span class="badge badge-organic">${organicLabel}</span>
                                ${p.availability === 'Limited Stock' ? '<span class="badge badge-pending" style="margin-left:4px;">Limited</span>' : ''}
                            </div>
                        </div>
                        <div class="product-body">
                            <div class="product-farmer">
                                <i class="fa-solid fa-circle-check"></i>
                                <span>${p.farmerName || 'Verified Farmer'}${p.farmName ? ' · ' + p.farmName : ''}</span>
                            </div>
                            <a href="/pages/product-details.html?id=${p.id}" class="product-title">${p.name || 'Produce'}</a>
                            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem;">${p.categoryName || ''} ${p.location ? '· ' + p.location : ''}</div>
                            <div class="product-rating">
                                ${stars}
                                <span class="rating-num">${rating.toFixed(1)} (${reviews})</span>
                            </div>
                            <div class="product-footer">
                                <div class="product-price">
                                    <span class="currency">₹${price.toFixed(2)}</span>
                                    <span class="unit">/${p.unit || 'kg'}</span>
                                </div>
                                <button class="btn btn-primary btn-sm add-cart-btn" data-id="${p.id}" data-name="${p.name || 'Produce'}" data-price="${price}" data-unit="${p.unit || 'kg'}" data-farmer="${p.farmerName || ''}" data-img="${imageUrl}">
                                    <i class="fa-solid fa-cart-plus"></i> Add
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add to Cart handlers
            grid.querySelectorAll('.add-cart-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const prod = {
                        id: Number(btn.dataset.id),
                        name: btn.dataset.name,
                        price: Number(btn.dataset.price),
                        unit: btn.dataset.unit,
                        farmerName: btn.dataset.farmer,
                        imageUrl: btn.dataset.img
                    };
                    Api.cart.addItem(prod, 1);
                });
            });
        }

        function generateStars(rating) {
            let stars = '';
            const full = Math.floor(rating);
            const half = rating - full >= 0.5;
            for (let i = 0; i < full; i++) stars += '<i class="fa-solid fa-star"></i>';
            if (half) stars += '<i class="fa-solid fa-star-half-stroke"></i>';
            for (let i = full + (half ? 1 : 0); i < 5; i++) stars += '<i class="fa-regular fa-star"></i>';
            return stars;
        }

        function renderPagination() {
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html = '';
            if (currentPage > 0) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${currentPage-1})"><i class="fa-solid fa-chevron-left"></i></button>`;
            for (let i = 0; i < totalPages; i++) {
                html += `<button class="btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-secondary'}" onclick="goPage(${i})">${i+1}</button>`;
            }
            if (currentPage < totalPages - 1) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${currentPage+1})"><i class="fa-solid fa-chevron-right"></i></button>`;
            container.innerHTML = html;
        }

        window.goPage = (p) => { currentPage = p; fetchProducts(); window.scrollTo(0, 0); };

        // Debounced search
        let searchTimer;
        document.getElementById('search-input').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { currentPage = 0; fetchProducts(); }, 400);
        });
        document.getElementById('sort-select').addEventListener('change', () => { currentPage = 0; fetchProducts(); });
        document.getElementById('filter-organic-only').addEventListener('change', renderMarketplace);

        const priceRange = document.getElementById('price-range');
        const priceVal = document.getElementById('price-val');
        priceRange.addEventListener('input', (e) => {
            priceVal.textContent = e.target.value;
            renderMarketplace();
        });

        document.getElementById('reset-filters').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            document.getElementById('filter-organic-only').checked = false;
            priceRange.value = 2000;
            priceVal.textContent = '2000';
            selectedCategoryId = '';
            currentPage = 0;
            renderCategoryList();
            fetchProducts();
        });

        // Init
        loadCategories().then(() => fetchProducts());
    </script>
</body>
</html>
