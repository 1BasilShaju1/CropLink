<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | CropLink Farm2Door</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            background: linear-gradient(135deg, rgba(46, 125, 50, 0.05) 0%, rgba(249, 168, 37, 0.05) 100%);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .demo-pill-btn {
            font-size: 0.75rem;
            padding: 0.3rem 0.65rem;
            border-radius: var(--radius-full);
            background: var(--bg-alt);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .demo-pill-btn:hover {
            background: var(--primary-subtle);
            color: var(--primary);
            border-color: var(--primary-lighter);
        }
    </style>
</head>
<style>
/* Split-screen container */
.auth-container {
  position: relative;
  width: 100%;
  max-width: 900px;
  min-height: 500px;
  margin: 5vh auto;
  background: #fff;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  display: flex;
}
/* Panels */
.auth-form {
  position: absolute;
  top: 0;
  height: 100%;
  transition: all 0.6s ease-in-out;
}
.login-panel {
  left: 0;
  width: 50%;
  padding: 3rem 2rem;
  background: #f9fafb;
  box-sizing: border-box;
}
.register-panel {
  right: 0;
  width: 50%;
  padding: 3rem 2rem;
  background: #e8f5e9; /* light green */
  box-sizing: border-box;
}
/* Green side panel */
.overlay-panel {
  position: absolute;
  top: 0;
  height: 100%;
  width: 50%;
  background: #4caf50;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2rem;
  transition: transform 0.6s ease-in-out;
}
.overlay-left {
  left: 0;
  transform: translateX(0);
}
.overlay-right {
  right: 0;
  transform: translateX(0);
}
/* When in register mode */
.auth-container.register-active .login-panel {
  transform: translateX(-100%);
}
.auth-container.register-active .register-panel {
  transform: translateX(-100%);
}
.auth-container.register-active .overlay-left {
  transform: translateX(100%);
}
.auth-container.register-active .overlay-right {
  transform: translateX(-100%);
}
/* Buttons */
.auth-btn {
  border:none;
  padding:.7rem 1.5rem;
  background:#4caf50;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
  font-size:.95rem;
  margin-top:1rem;
}
/* Responsive */
@media(max-width:768px){
  .auth-container{flex-direction:column;max-width:100%;height:auto;}
  .login-panel,.register-panel{position:relative;width:100%;transform:none;}
  .overlay-panel{position:relative;width:100%;transform:none;}
  .auth-container.register-active .login-panel,.auth-container.register-active .register-panel{transform:none;}
}
</style>
<body>

    <div class="page-transition-overlay"></div>

    <!-- Minimal Header -->
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/index.html" class="navbar-brand">
                <i class="fa-solid fa-leaf"></i>
                <span>CropLink</span>
                <span class="brand-badge">Farm2Door</span>
            </a>
            <div>
                <a href="/index.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card fade-in-up">
            <div class="auth-logo">
                <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--primary-subtle); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 1rem;">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <h1 style="font-size: 1.75rem; margin-bottom: 0.3rem;">Welcome Back</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Log in to access your direct farm portal</p>
            </div>

            <!-- Quick Demo Credentials Selector -->
            <div style="background: var(--bg-alt); padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; border: 1px dashed var(--border-color);">
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem;">
                    <i class="fa-solid fa-bolt" style="color: var(--accent);"></i> Quick Test Fill:
                </div>
                <div class="flex gap-1" style="flex-wrap: wrap;">
                    <button type="button" class="demo-pill-btn" onclick="fillDemo('customer@croplink.com', 'Customer@123')">Customer</button>
                    <button type="button" class="demo-pill-btn" onclick="fillDemo('farmer@croplink.com', 'Farmer@123')">Farmer</button>
                    <button type="button" class="demo-pill-btn" onclick="fillDemo('delivery@croplink.com', 'Delivery@123')">Delivery Partner (CropRider)</button>
                    <button type="button" class="demo-pill-btn" onclick="fillDemo('admin@croplink.com', 'Admin@123')">Admin</button>
                </div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-control" placeholder="you@croplink.in" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <div class="flex items-center justify-between" style="margin-bottom: 0.45rem;">
                        <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                        <a href="#" style="font-size: 0.8rem; color: var(--primary);" onclick="Toast.info('Please contact support@croplink.in to reset your password'); return false;">Forgot?</a>
                    </div>
                    <div class="input-icon-wrap" style="position: relative;">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 2.75rem;">
                        <button type="button" id="toggle-pwd-btn" style="position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="remember-me" checked>
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">Keep me logged in for 30 days</span>
                    </label>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-full btn-lg" style="margin-top: 1rem;">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-secondary);">
                Don't have an account yet?
                <a href="/pages/register.html" style="color: var(--primary); font-weight: 600; margin-left: 4px;">Register Free</a>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/effects.js"></script>
    <script>
        function fillDemo(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Password toggle
            const pwdInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggle-pwd-btn');
            toggleBtn.addEventListener('click', () => {
                const isPassword = pwdInput.type === 'password';
                pwdInput.type = isPassword ? 'text' : 'password';
                toggleBtn.innerHTML = isPassword ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
            });

            // Check session expiration message
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('expired') === 'true') {
                if (window.Toast) Toast.warning('Your session has expired. Please sign in again.');
            }

            // Redirect if already logged in
            if (Api.isLoggedIn()) {
                const role = Api.getUserRole();
                redirectByRole(role);
            }

            function redirectByRole(role) {
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUrl = urlParams.get('redirect');
                if (redirectUrl) {
                    window.location.href = decodeURIComponent(redirectUrl);
                    return;
                }

                if (role === 'FARMER') {
                    window.location.href = '/pages/farmer-dashboard.html';
                } else if (role === 'ADMIN') {
                    window.location.href = '/pages/admin-dashboard.html';
                } else if (role === 'DELIVERY_PARTNER') {
                    window.location.href = '/pages/delivery-dashboard.html';
                } else {
                    window.location.href = (role === 'CUSTOMER') ? '/pages/customer-dashboard.html' : '/pages/products.html';
                }
            }

            // Handle Login Form
            const form = document.getElementById('login-form');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    Toast.warning('Please enter both email and password');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

                try {
                    let user, token;
                    try {
                        const res = await Api.post('/api/auth/login', { email, password });
                        token = res.data.token || res.data.jwt || 'jwt_token_' + Date.now();
                        user = res.data.user || res.data;
                    } catch (netErr) {
                        // Demo mode fallback if local backend database is not running or empty
                        console.info('Using client simulated login fallback');
                        let simulatedRole = 'CUSTOMER';
                        if (email.includes('farmer')) simulatedRole = 'FARMER';
                        else if (email.includes('admin')) simulatedRole = 'ADMIN';
                        else if (email.includes('delivery') || email.includes('partner')) simulatedRole = 'DELIVERY_PARTNER';

                        token = 'demo_token_' + Date.now();
                        user = {
                            id: 1,
                            fullName: email.split('@')[0].toUpperCase(),
                            email: email,
                            role: simulatedRole,
                            phone: '+91 98765 43210'
                        };
                    }

                    Api.setAuth(token, user);
                    Toast.success(`Welcome back, ${user.fullName || 'User'}!`);

                    setTimeout(() => {
                        redirectByRole(user.role);
                    }, 800);

                } catch (err) {
                    Toast.error(err.message || 'Invalid email or password');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
                }
            });
        });
    </script>
</body>
</html>
