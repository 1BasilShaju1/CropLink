<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — CropLink</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#f0f4f0;font-family:'Poppins',sans-serif;min-height:100vh}
.top-nav{background:linear-gradient(135deg,#1b5e20,#2e7d32);padding:16px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.top-nav .logo{color:#fff;font-size:1.2rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px}
.top-nav .nav-links a{color:rgba(255,255,255,.85);text-decoration:none;margin-left:20px;font-size:.9rem}
.container{max-width:760px;margin:40px auto;padding:0 20px}
.btn-back{background:transparent;border:1px solid #4caf50;color:#2e7d32;padding:10px 22px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;transition:.2s}
.btn-back:hover{background:#e8f5e9}
.order-header-card{background:linear-gradient(135deg,#1b5e20,#4caf50);border-radius:20px;padding:32px;color:#fff;margin-bottom:28px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.order-header-card h2{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.order-header-card .order-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;font-size:.9rem;opacity:.9}
.order-header-card .amount{font-size:1.8rem;font-weight:800;margin-top:8px}
.status-pill{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:5px 16px;border-radius:20px;font-size:.88rem;font-weight:600;margin-top:8px}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:24px}
.card-title{font-size:1.05rem;font-weight:700;color:#1b5e20;margin-bottom:20px;display:flex;align-items:center;gap:8px}
/* Tracking timeline */
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:2px;background:#e0e0e0}
.timeline-step{position:relative;margin-bottom:28px}
.timeline-step:last-child{margin-bottom:0}
.step-dot{position:absolute;left:-32px;width:26px;height:26px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#bbb;border:2px solid #fff;box-shadow:0 0 0 2px #e0e0e0}
.step-dot.completed{background:#4caf50;color:#fff;box-shadow:0 0 0 2px #4caf50}
.step-dot.active{background:#2196f3;color:#fff;box-shadow:0 0 0 2px #2196f3;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px #2196f3}50%{box-shadow:0 0 0 6px rgba(33,150,243,.3)}}
.step-label{font-weight:600;color:#333;font-size:.92rem}
.step-label.completed{color:#2e7d32}
.step-label.active{color:#1565c0}
.step-label.pending{color:#bbb}
.step-time{font-size:.8rem;color:#aaa;margin-top:2px}
.items-list{display:flex;flex-direction:column;gap:12px}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f9f9f9;border-radius:10px}
.item-name{font-weight:600;color:#333;font-size:.9rem}
.item-qty{font-size:.85rem;color:#777}
.item-total{font-weight:700;color:#1b5e20;font-size:.95rem}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info-cell{padding:14px;background:#f9fafb;border-radius:10px}
.info-cell label{font-size:.78rem;color:#aaa;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.info-cell span{font-size:.9rem;font-weight:600;color:#333}
.badge-PENDING{background:#fff3e0;color:#e65100}
.badge-ACCEPTED{background:#e3f2fd;color:#1565c0}
.badge-PACKED{background:#f3e5f5;color:#6a1b9a}
.badge-OUT_FOR_DELIVERY{background:#e0f2f1;color:#00695c}
.badge-DELIVERED{background:#e8f5e9;color:#2e7d32}
.badge-CANCELLED{background:#ffebee;color:#c62828}
.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.82rem;font-weight:600}
@media(max-width:600px){.order-header-card .order-meta,.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="/" class="logo"><i class="fas fa-leaf"></i> CropLink</a>
  <div class="nav-links">
    <a href="/pages/customer-orders.html"><i class="fas fa-list"></i> My Orders</a>
    <a href="/pages/profile.html"><i class="fas fa-user"></i> Profile</a>
  </div>
</nav>

<div class="container">
  <a href="/pages/customer-orders.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Orders</a>

  <div id="order-header-card" class="order-header-card">
    <h2><i class="fas fa-shipping-fast"></i> Order Tracking</h2>
    <p id="order-id-display">Loading order...</p>
    <div class="order-meta" id="order-meta"></div>
    <div class="amount" id="order-amount"></div>
    <div id="order-status-pill"></div>
  </div>

  <!-- Tracking Timeline -->
  <div class="card">
    <div class="card-title"><i class="fas fa-map-marked-alt"></i> Delivery Progress</div>
    <div class="timeline" id="timeline">
      <div style="text-align:center;color:#aaa;padding:20px"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    </div>
  </div>

  <!-- Order Items -->
  <div class="card">
    <div class="card-title"><i class="fas fa-box"></i> Order Items</div>
    <div class="items-list" id="items-list"></div>
    <div style="border-top:2px solid #e8f5e9;margin-top:16px;padding-top:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:.9rem;color:#666">
        <span>Subtotal</span><span id="subtotal">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:.9rem;color:#666">
        <span>Delivery Fee</span><span id="delivery-fee">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;color:#1b5e20">
        <span>Total</span><span id="final-amount">—</span>
      </div>
    </div>
  </div>

  <!-- Delivery & Payment Info -->
  <div class="card">
    <div class="card-title"><i class="fas fa-info-circle"></i> Order Details</div>
    <div class="info-grid" id="order-details-grid"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/effects.js"></script>
<script>
if (!Api.isLoggedIn()) window.location.href = '/pages/login.html';

const STEPS = [
  { status: 'PENDING',           label: 'Order Placed',       icon: 'fas fa-check' },
  { status: 'ACCEPTED',          label: 'Accepted by Farmer', icon: 'fas fa-handshake' },
  { status: 'PACKED',            label: 'Packed & Ready',     icon: 'fas fa-box' },
  { status: 'OUT_FOR_DELIVERY',  label: 'Out for Delivery',   icon: 'fas fa-truck' },
  { status: 'DELIVERED',         label: 'Delivered',          icon: 'fas fa-home' }
];

const STATUS_ORDER = { PENDING:0, ACCEPTED:1, PACKED:2, OUT_FOR_DELIVERY:3, DELIVERED:4, CANCELLED:-1 };

const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');

if (!orderId) window.location.href = '/pages/customer-orders.html';

async function loadOrder() {
  try {
    const res = await Api.get(`/api/customer/orders/${orderId}`);
    const o = res.data;
    renderOrderHeader(o);
    renderTimeline(o.orderStatus);
    renderItems(o);
    renderDetails(o);
  } catch(e) {
    showToast('Failed to load order: ' + e.message, 'error');
    document.getElementById('order-id-display').textContent = 'Error loading order';
  }
}

function renderOrderHeader(o) {
  document.getElementById('order-id-display').textContent = `Order #${o.id}`;
  document.getElementById('order-amount').textContent = `₹${Number(o.finalAmount).toLocaleString('en-IN')}`;
  document.getElementById('order-status-pill').innerHTML = `<span class="status-pill">${o.orderStatus.replace(/_/g,' ')}</span>`;
  document.getElementById('order-meta').innerHTML = `
    <span><i class="fas fa-user"></i> ${o.farmerName}</span>
    <span><i class="fas fa-calendar"></i> ${new Date(o.orderDate).toLocaleDateString('en-IN')}</span>
    <span><i class="fas fa-truck"></i> ${o.deliveryMethod}</span>
    <span><i class="fas fa-credit-card"></i> ${o.paymentMethod}</span>`;
}

function renderTimeline(currentStatus) {
  if (currentStatus === 'CANCELLED') {
    document.getElementById('timeline').innerHTML = `
      <div style="text-align:center;padding:30px">
        <i class="fas fa-times-circle" style="font-size:2.5rem;color:#e53935;margin-bottom:10px;display:block"></i>
        <h3 style="color:#e53935">Order Cancelled</h3>
        <p style="color:#aaa;margin-top:6px">This order has been cancelled.</p>
      </div>`;
    return;
  }
  const currentIdx = STATUS_ORDER[currentStatus] ?? 0;
  document.getElementById('timeline').innerHTML = STEPS.map((step, idx) => {
    const isCompleted = idx < currentIdx;
    const isActive = idx === currentIdx;
    const dotClass = isCompleted ? 'completed' : isActive ? 'active' : '';
    const labelClass = isCompleted ? 'completed' : isActive ? 'active' : 'pending';
    return `
      <div class="timeline-step">
        <div class="step-dot ${dotClass}"><i class="${step.icon}"></i></div>
        <div class="step-label ${labelClass}">${step.label} ${isActive ? '<i class="fas fa-circle" style="font-size:.5rem;color:#2196f3;vertical-align:middle"></i>' : ''}</div>
        <div class="step-time">${isCompleted ? '✓ Completed' : isActive ? 'Current status' : 'Pending'}</div>
      </div>`;
  }).join('');
}

function renderItems(o) {
  const items = o.orderItems || [];
  document.getElementById('items-list').innerHTML = items.length
    ? items.map(item => `
        <div class="item-row">
          <div><div class="item-name">${item.productName}</div><div class="item-qty">× ${item.quantity} ${item.unit||''}</div></div>
          <div class="item-total">₹${Number(item.subtotal).toLocaleString('en-IN')}</div>
        </div>`).join('')
    : '<p style="color:#aaa;text-align:center">No items</p>';
  document.getElementById('subtotal').textContent = `₹${Number(o.totalAmount).toLocaleString('en-IN')}`;
  document.getElementById('delivery-fee').textContent = `₹${Number(o.deliveryFee||0).toLocaleString('en-IN')}`;
  document.getElementById('final-amount').textContent = `₹${Number(o.finalAmount).toLocaleString('en-IN')}`;
}

function renderDetails(o) {
  document.getElementById('order-details-grid').innerHTML = `
    <div class="info-cell"><label>Farmer</label><span>${o.farmerName}</span></div>
    <div class="info-cell"><label>Payment Method</label><span>${o.paymentMethod}</span></div>
    <div class="info-cell"><label>Payment Status</label><span><span class="badge badge-${o.paymentStatus}">${o.paymentStatus}</span></span></div>
    <div class="info-cell"><label>Delivery Method</label><span>${o.deliveryMethod}</span></div>
    <div class="info-cell"><label>Delivery Address</label><span>${o.deliveryAddress || 'Farm Pickup'}</span></div>
    ${o.deliveredDate ? `<div class="info-cell"><label>Delivered On</label><span>${new Date(o.deliveredDate).toLocaleDateString('en-IN')}</span></div>` : ''}
    ${o.deliveryPartnerName ? `<div class="info-cell"><label>Delivery Partner</label><span>${o.deliveryPartnerName}</span></div>` : ''}`;
}

loadOrder();
</script>
</body>
</html>
