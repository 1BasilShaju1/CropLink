<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Farm Harvests | CropLink Farm2Door</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <div class="page-transition-overlay"></div>

    <header class="navbar">
        <div class="container-fluid navbar-inner">
            <a href="/index.html" class="navbar-brand">
                <i class="fa-solid fa-leaf"></i>
                <span>CropLink</span>
                <span class="brand-badge">Farmer Portal</span>
            </a>

            <div class="navbar-actions">
                <a href="/pages/add-product.html" class="btn btn-primary btn-sm">
                    <i class="fa-solid fa-plus"></i> Add Crop
                </a>
                <a href="/pages/farmer-dashboard.html" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
            </div>
        </div>
    </header>

    <div class="dashboard-wrapper">
        <aside class="dashboard-sidebar">
            <div class="sidebar-heading">Navigation</div>
            <a href="/pages/farmer-dashboard.html" class="sidebar-link">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>
            <a href="/pages/farmer-products.html" class="sidebar-link active">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span>My Harvests</span>
            </a>
            <a href="/pages/add-product.html" class="sidebar-link">
                <i class="fa-solid fa-circle-plus"></i>
                <span>Add Crop</span>
            </a>
            <a href="/pages/farmer-orders.html" class="sidebar-link">
                <i class="fa-solid fa-truck-ramp-box"></i>
                <span>Order Deliveries</span>
            </a>
            <a href="/pages/profile.html" class="sidebar-link">
                <i class="fa-solid fa-user-gear"></i>
                <span>Farm Profile</span>
            </a>
        </aside>

        <main class="dashboard-main">
            <div class="flex items-center justify-between" style="margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h1 style="font-size: 1.85rem; margin-bottom: 0.25rem;">My Crop Inventory</h1>
                    <p style="color: var(--text-muted); font-size: 0.95rem;" id="inventory-subtitle">Manage listed crops, update market prices, and adjust harvest stock.</p>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="filter-search" class="form-control" placeholder="Search my crops..." style="max-width: 240px;">
                    <a href="/pages/add-product.html" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i> List New Harvest
                    </a>
                </div>
            </div>

            <!-- Filter Chips -->
            <div class="flex gap-2" style="margin-bottom: 1.5rem;" id="status-filter-group">
                <button class="btn btn-primary btn-sm filter-pill" data-status="ALL">All Crops (<span id="count-all">0</span>)</button>
                <button class="btn btn-secondary btn-sm filter-pill" data-status="ACTIVE">Active (<span id="count-active">0</span>)</button>
                <button class="btn btn-secondary btn-sm filter-pill" data-status="PENDING_APPROVAL">Pending (<span id="count-pending">0</span>)</button>
                <button class="btn btn-secondary btn-sm filter-pill" data-status="INACTIVE">Inactive (<span id="count-inactive">0</span>)</button>
            </div>

            <!-- Products Grid -->
            <div class="grid grid-cols-3 gap-3" id="farmer-products-grid">
                <div style="grid-column:1/-1; text-align:center; padding:3rem;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color:var(--primary);"></i>
                    <p style="margin-top:1rem; color:var(--text-muted);">Loading your products...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Product Modal -->
    <div class="modal-backdrop" id="edit-modal">
        <div class="modal-dialog" style="max-width:600px;">
            <div class="modal-header">
                <h3 style="font-size: 1.15rem; margin: 0;"><i class="fa-solid fa-pen-to-square" style="color:var(--primary); margin-right: 6px;"></i> Edit Crop Details</h3>
                <button class="btn btn-sm" onclick="closeEditModal()" style="background:none; border:none; color:var(--text-muted); font-size: 1.1rem;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="edit-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-prod-id">
                    <div class="grid grid-cols-2 gap-2">
                        <div class="form-group">
                            <label class="form-label" for="edit-prod-name">Crop Name</label>
                            <input type="text" id="edit-prod-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-prod-category">Category ID</label>
                            <input type="number" id="edit-prod-category" class="form-control" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="form-group">
                            <label class="form-label" for="edit-prod-price">Price (₹)</label>
                            <input type="number" id="edit-prod-price" class="form-control" required min="1" step="0.5">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-prod-qty">Stock Qty</label>
                            <input type="number" id="edit-prod-qty" class="form-control" required min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-prod-unit">Unit</label>
                            <select id="edit-prod-unit" class="form-control">
                                <option value="kg">kg</option>
                                <option value="g">g</option>
                                <option value="piece">piece</option>
                                <option value="dozen">dozen</option>
                                <option value="litre">litre</option>
                                <option value="bunch">bunch</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="edit-prod-availability">Availability</label>
                        <select id="edit-prod-availability" class="form-control">
                            <option value="Available">Available</option>
                            <option value="Limited Stock">Limited Stock</option>
                            <option value="Out of Stock">Out of Stock</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="edit-prod-desc">Description</label>
                        <textarea id="edit-prod-desc" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/effects.js"></script>
    <script>
        // Auth Guard: FARMER and ADMIN
        Api.requireAuth(['FARMER', 'ADMIN']);

        let myProducts = [];
        let currentFilter = 'ALL';

        async function loadProducts() {
            const grid = document.getElementById('farmer-products-grid');
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color:var(--primary);"></i><p style="margin-top:1rem; color:var(--text-muted);">Loading your products...</p></div>`;
            try {
                const res = await Api.get('/api/farmer/products');
                let prods = [];
                if (res && res.data) {
                    if (Array.isArray(res.data)) {
                        prods = res.data;
                    } else if (res.data.content && Array.isArray(res.data.content)) {
                        prods = res.data.content;
                    }
                }
                myProducts = prods;
            } catch (err) {
                console.error('Failed to load products:', err);
                myProducts = [];
                if (window.Toast) Toast.error('Failed to load products: ' + (err.message || 'Please refresh.'));
            }
            updateCounts();
            renderGrid();
        }

        function updateCounts() {
            const all = myProducts.length;
            const active = myProducts.filter(p => p.productStatus === 'ACTIVE').length;
            const pending = myProducts.filter(p => p.productStatus === 'PENDING_APPROVAL').length;
            const inactive = myProducts.filter(p => p.productStatus === 'INACTIVE').length;
            document.getElementById('count-all').textContent = all;
            document.getElementById('count-active').textContent = active;
            document.getElementById('count-pending').textContent = pending;
            document.getElementById('count-inactive').textContent = inactive;
            document.getElementById('inventory-subtitle').textContent = `You have ${all} crop listing${all !== 1 ? 's' : ''}. Manage prices, stock, and availability.`;
        }

        function renderGrid() {
            const grid = document.getElementById('farmer-products-grid');
            const searchKeyword = document.getElementById('filter-search').value.toLowerCase();

            const filtered = myProducts.filter(p => {
                const matchesFilter = (currentFilter === 'ALL') || (p.productStatus === currentFilter);
                const searchIn = (p.name + ' ' + (p.categoryName || '')).toLowerCase();
                const matchesSearch = !searchKeyword || searchIn.includes(searchKeyword);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
                        <i class="fa-solid fa-boxes-packing" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
                        <h3>No crops found</h3>
                        <p style="color: var(--text-muted);">Try adjusting your filter or <a href="/pages/add-product.html">add a new crop</a></p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const imageUrl = p.primaryImageUrl || (p.imageUrls && p.imageUrls[0]) || 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400&auto=format&fit=crop&q=80';
                const statusBadge = p.productStatus === 'ACTIVE' ? 'badge-delivered' :
                                    p.productStatus === 'PENDING_APPROVAL' ? 'badge-pending' :
                                    p.productStatus === 'REJECTED' ? 'badge-cancelled' : 'badge-secondary';
                const statusLabel = p.productStatus === 'PENDING_APPROVAL' ? 'Pending Approval' :
                                    p.productStatus ? p.productStatus.replace(/_/g, ' ') : 'Unknown';
                const isAvail = (p.availability === 'Available' || p.availability === 'IN_STOCK' || (p.quantityAvailable > 0 && p.availability !== 'OUT_OF_STOCK'));
                const availBadge = isAvail ? '#22c55e' : (p.availability === 'Limited Stock' ? '#f59e0b' : '#ef4444');
                return `
                <div class="card card-hover-lift product-card">
                    <div class="product-image-wrap">
                        <img src="${imageUrl}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400&auto=format&fit=crop&q=80'">
                        <div class="product-badges">
                            <span class="badge ${statusBadge}">${statusLabel}</span>
                        </div>
                    </div>
                    <div class="product-body">
                        <div class="flex items-center justify-between" style="margin-bottom: 0.35rem;">
                            <span class="badge badge-organic" style="font-size: 0.7rem;">${p.categoryName || 'Uncategorized'}</span>
                            <span style="font-size: 0.75rem; color: var(--text-muted);"><i class="fa-solid fa-calendar-day"></i> ${p.harvestDate || 'N/A'}</span>
                        </div>
                        <h3 class="product-title" style="cursor:default;">${p.name}</h3>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                            ${p.description || 'No description provided.'}
                        </p>
                        <div class="flex items-center justify-between" style="margin-bottom: 1rem;">
                            <div>
                                <span style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">₹${Number(p.price).toFixed(2)}</span>
                                <span style="font-size: 0.8rem; color: var(--text-muted);">/${p.unit}</span>
                            </div>
                            <div style="font-size: 0.85rem; font-weight: 600; color: ${availBadge};">
                                <i class="fa-solid fa-warehouse"></i> ${p.quantityAvailable} ${p.unit}
                            </div>
                        </div>
                        <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:0.75rem;">
                            ${p.organicStatus ? '<i class="fa-solid fa-leaf" style="color:var(--primary);"></i> ' + p.organicStatus : ''}
                            ${p.qualityGrade ? ' &bull; ' + p.qualityGrade : ''}
                        </div>
                        <div class="flex gap-2" style="border-top: 1px solid var(--border-color); padding-top: 0.75rem;">
                            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="openEditModal(${p.id})">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                            <button class="btn btn-outline btn-sm" style="color: #DC2626; border-color: #FCA5A5;" onclick="deleteProduct(${p.id})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Delete Product
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to remove this crop listing?')) return;
            try {
                await Api.delete(`/api/farmer/products/${id}`);
                myProducts = myProducts.filter(p => p.id !== id);
                Toast.success('Crop removed successfully');
                updateCounts();
                renderGrid();
            } catch (e) {
                Toast.error(e.message || 'Failed to delete product');
            }
        }

        // Edit Modal
        const editModal = document.getElementById('edit-modal');
        function openEditModal(id) {
            const p = myProducts.find(item => item.id === id);
            if (!p) return;
            document.getElementById('edit-prod-id').value = p.id;
            document.getElementById('edit-prod-name').value = p.name;
            document.getElementById('edit-prod-category').value = p.categoryId;
            document.getElementById('edit-prod-price').value = p.price;
            document.getElementById('edit-prod-qty').value = p.quantityAvailable;
            document.getElementById('edit-prod-unit').value = p.unit;
            document.getElementById('edit-prod-availability').value = p.availability || 'Available';
            document.getElementById('edit-prod-desc').value = p.description || '';
            editModal.classList.add('active');
        }

        function closeEditModal() { editModal.classList.remove('active'); }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = Number(document.getElementById('edit-prod-id').value);
            const formData = new FormData();
            formData.append('name', document.getElementById('edit-prod-name').value);
            formData.append('categoryId', document.getElementById('edit-prod-category').value);
            formData.append('price', document.getElementById('edit-prod-price').value);
            formData.append('quantityAvailable', document.getElementById('edit-prod-qty').value);
            formData.append('unit', document.getElementById('edit-prod-unit').value);
            formData.append('availability', document.getElementById('edit-prod-availability').value);
            formData.append('description', document.getElementById('edit-prod-desc').value);

            try {
                const res = await Api.putForm(`/api/farmer/products/${id}`, formData);
                if (res && res.data) {
                    const idx = myProducts.findIndex(p => p.id === id);
                    if (idx >= 0) myProducts[idx] = res.data;
                }
                closeEditModal();
                Toast.success('Product updated successfully');
                updateCounts();
                renderGrid();
            } catch (err) {
                Toast.error(err.message || 'Failed to update product');
            }
        });

        // Search & Filters
        document.getElementById('filter-search').addEventListener('input', renderGrid);
        document.querySelectorAll('.filter-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-pill').forEach(b => {
                    b.classList.remove('btn-primary');
                    b.classList.add('btn-secondary');
                });
                btn.classList.remove('btn-secondary');
                btn.classList.add('btn-primary');
                currentFilter = btn.getAttribute('data-status');
                renderGrid();
            });
        });

        loadProducts();
    </script>
</body>
</html>
