<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | CropLink Farm2Door</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2.5rem;
            padding: 3rem 0;
        }
        .method-card {
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: var(--bg-surface);
        }
        .method-card:hover {
            border-color: var(--primary-lighter);
        }
        .method-card.selected {
            border-color: var(--primary);
            background: var(--primary-subtle);
        }
        .method-card input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }
        @media (max-width: 900px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="page-transition-overlay"></div>

    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/index.html" class="navbar-brand">
                <i class="fa-solid fa-leaf"></i>
                <span>CropLink</span>
                <span class="brand-badge">Farm2Door</span>
            </a>

            <div>
                <a href="/pages/cart.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Return to Basket</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="checkout-grid">
            <!-- Left Form Section -->
            <div>
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Complete Your Order</h1>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">Ensure your delivery address is accurate for fresh farm dispatch.</p>

                <form id="checkout-form">
                    <!-- Delivery Address Card -->
                    <div class="card" style="margin-bottom: 2rem;">
                        <h3 style="font-size: 1.2rem; color: var(--primary); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fa-solid fa-location-dot"></i> 1. Delivery Destination
                        </h3>

                        <div class="grid grid-cols-2 gap-2">
                            <div class="form-group">
                                <label class="form-label" for="ship-name">Recipient Full Name *</label>
                                <input type="text" id="ship-name" class="form-control" required placeholder="Full Name">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="ship-phone">Contact Mobile Number *</label>
                                <input type="tel" id="ship-phone" class="form-control" required placeholder="10-digit mobile" pattern="[0-9]{10}">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="ship-address">Street Address / House No. *</label>
                            <input type="text" id="ship-address" class="form-control" required placeholder="Flat / House No., Apartment, Street name">
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <div class="form-group">
                                <label class="form-label" for="ship-city">City / District *</label>
                                <input type="text" id="ship-city" class="form-control" required placeholder="City">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="ship-state">State *</label>
                                <input type="text" id="ship-state" class="form-control" required placeholder="State">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="ship-pincode">Pincode *</label>
                                <input type="text" id="ship-pincode" class="form-control" required placeholder="6-digit pincode" pattern="[0-9]{6}">
                            </div>
                        </div>
                    </div>

                    <!-- Delivery Method Selector -->
                    <div class="card" style="margin-bottom: 2rem;">
                        <h3 style="font-size: 1.2rem; color: var(--primary); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fa-solid fa-truck-ramp-box"></i> 2. Choose Delivery Method
                        </h3>

                        <div class="flex flex-col gap-2">
                            <label class="method-card selected">
                                <input type="radio" name="deliveryMethod" value="EXPRESS_PARTNER" checked>
                                <i class="fa-solid fa-truck-fast" style="font-size: 1.5rem; color: var(--primary);"></i>
                                <div style="flex:1;">
                                    <div style="font-weight: 700; font-size: 0.95rem;">CropLink Express Partner (Recommended)</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">Temperature-controlled van drop within 3-5 hours</div>
                                </div>
                                <strong style="color: var(--primary);">FREE</strong>
                            </label>

                            <label class="method-card">
                                <input type="radio" name="deliveryMethod" value="FARMER_DIRECT">
                                <i class="fa-solid fa-tractor" style="font-size: 1.5rem; color: var(--accent);"></i>
                                <div style="flex:1;">
                                    <div style="font-weight: 700; font-size: 0.95rem;">Farmer Direct Delivery</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">Farmer brings directly using local agri route (Tomorrow morning)</div>
                                </div>
                                <strong>₹25.00</strong>
                            </label>

                            <label class="method-card">
                                <input type="radio" name="deliveryMethod" value="FARM_PICKUP">
                                <i class="fa-solid fa-house-chimney-window" style="font-size: 1.5rem; color: #00897B;"></i>
                                <div style="flex:1;">
                                    <div style="font-weight: 700; font-size: 0.95rem;">Self Farm Gate Pickup</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">Collect directly from the farm gates in person</div>
                                </div>
                                <strong style="color: var(--primary);">FREE</strong>
                            </label>
                        </div>
                    </div>

                    <!-- Payment Method Selector -->
                    <div class="card" style="margin-bottom: 2rem;">
                        <h3 style="font-size: 1.2rem; color: var(--primary); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fa-solid fa-credit-card"></i> 3. Payment Method
                        </h3>

                        <div class="flex flex-col gap-2">
                            <label class="method-card selected">
                                <input type="radio" name="paymentMethod" value="COD" checked>
                                <i class="fa-solid fa-hand-holding-dollar" style="font-size: 1.5rem; color: var(--primary);"></i>
                                <div style="flex:1;">
                                    <div style="font-weight: 700; font-size: 0.95rem;">Cash on Delivery (COD)</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">Inspect freshness first, pay cash or UPI at your doorstep</div>
                                </div>
                            </label>

                            <label class="method-card">
                                <input type="radio" name="paymentMethod" value="UPI">
                                <i class="fa-solid fa-qrcode" style="font-size: 1.5rem; color: var(--accent);"></i>
                                <div style="flex:1;">
                                    <div style="font-weight: 700; font-size: 0.95rem;">Instant UPI (Google Pay / PhonePe / Paytm / BHIM)</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">Scan QR or enter VPA for instant zero fee payment</div>
                                </div>
                            </label>

                            <label class="method-card">
                                <input type="radio" name="paymentMethod" value="CARD">
                                <i class="fa-solid fa-credit-card" style="font-size: 1.5rem; color: #1976D2;"></i>
                                <div style="flex:1;">
                                    <div style="font-weight: 700; font-size: 0.95rem;">Credit / Debit Card & NetBanking</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">All major Indian banks supported with 3D Secure OTP</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Delivery Instructions -->
                    <div class="form-group">
                        <label class="form-label" for="order-notes">Delivery Instructions / Gate Landmark</label>
                        <textarea id="order-notes" class="form-control" rows="2" placeholder="e.g. Near Community Temple, please leave box on porch..."></textarea>
                    </div>
                </form>
            </div>

            <!-- Right: Order Summary Sidebar -->
            <div>
                <div class="card" style="position: sticky; top: 90px; padding: 1.5rem;">
                    <h3 style="font-size: 1.25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
                        Basket Items (<span id="checkout-item-count">0</span>)
                    </h3>

                    <div id="checkout-items-preview" style="max-height: 250px; overflow-y: auto; margin-bottom: 1.25rem;">
                        <!-- Item summaries -->
                    </div>

                    <div class="flex items-center justify-between" style="margin-bottom: 0.6rem; font-size: 0.9rem;">
                        <span style="color: var(--text-secondary);">Subtotal:</span>
                        <strong id="chk-subtotal">₹0.00</strong>
                    </div>

                    <div class="flex items-center justify-between" style="margin-bottom: 0.6rem; font-size: 0.9rem;">
                        <span style="color: var(--text-secondary);">Delivery Fee:</span>
                        <strong id="chk-delivery" style="color: var(--primary);">FREE</strong>
                    </div>

                    <div style="border-top: 1.5px dashed var(--border-color); padding-top: 1rem; margin-top: 1rem; margin-bottom: 1.5rem; display: flex; align-items: baseline; justify-content: space-between;">
                        <span style="font-size: 1.1rem; font-weight: 700;">Total Amount:</span>
                        <span id="chk-total" style="font-size: 1.6rem; font-weight: 800; color: var(--primary-dark);">₹0.00</span>
                    </div>

                    <button type="button" id="place-order-btn" class="btn btn-primary btn-full btn-lg">
                        <i class="fa-solid fa-lock"></i> Place Secure Order
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/effects.js"></script>
    <script>
        // Auth Guard
        Api.requireAuth(['CUSTOMER', 'FARMER', 'ADMIN', 'DELIVERY_PARTNER']);

        // Prefill user details if available
        const currentUser = Api.getUser() || {};
        if (currentUser.fullName) document.getElementById('ship-name').value = currentUser.fullName;
        if (currentUser.phone) document.getElementById('ship-phone').value = currentUser.phone;
        if (currentUser.address) document.getElementById('ship-address').value = currentUser.address;
        if (currentUser.district) document.getElementById('ship-city').value = currentUser.district;
        if (currentUser.state) document.getElementById('ship-state').value = currentUser.state;
        if (currentUser.pincode) document.getElementById('ship-pincode').value = currentUser.pincode;

        const cart = Api.cart.getCart();
        if (cart.length === 0) {
            Toast.info('Your basket is empty. Please add crops first.');
            window.location.href = '/pages/products.html';
        }

        // Render mini items list
        document.getElementById('checkout-item-count').textContent = cart.length;
        const previewEl = document.getElementById('checkout-items-preview');
        previewEl.innerHTML = cart.map(item => `
            <div class="flex items-center justify-between gap-2" style="margin-bottom: 0.75rem; font-size: 0.85rem;">
                <div style="display:flex; align-items:center; gap:0.5rem; overflow:hidden;">
                    <img src="${item.imageUrl}" style="width:36px; height:36px; border-radius:4px; object-fit:cover;">
                    <div style="text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:160px;">
                        <strong>${item.name}</strong>
                        <div style="color:var(--text-muted); font-size:0.75rem;">Qty: ${item.quantity} ${item.unit}</div>
                    </div>
                </div>
                <strong>₹${(item.price * item.quantity).toFixed(2)}</strong>
            </div>
        `).join('');

        const subtotal = Api.cart.getSubtotal();
        let deliveryCost = 0;

        function updateTotals() {
            const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
            if (method === 'FARMER_DIRECT') deliveryCost = 25;
            else deliveryCost = 0;

            document.getElementById('chk-subtotal').textContent = '₹' + subtotal.toFixed(2);
            document.getElementById('chk-delivery').textContent = deliveryCost === 0 ? 'FREE' : '₹' + deliveryCost.toFixed(2);
            document.getElementById('chk-total').textContent = '₹' + (subtotal + deliveryCost).toFixed(2);
        }
        updateTotals();

        // Method card radio visual selection
        document.querySelectorAll('.method-card').forEach(card => {
            card.addEventListener('click', () => {
                const radio = card.querySelector('input[type="radio"]');
                radio.checked = true;
                const groupName = radio.name;
                document.querySelectorAll(`input[name="${groupName}"]`).forEach(r => {
                    r.closest('.method-card').classList.remove('selected');
                });
                card.classList.add('selected');
                updateTotals();
            });
        });

        // Place Order
        document.getElementById('place-order-btn').addEventListener('click', async () => {
            const shipName = document.getElementById('ship-name').value.trim();
            const shipPhone = document.getElementById('ship-phone').value.trim();
            const shipAddress = document.getElementById('ship-address').value.trim();
            const shipCity = document.getElementById('ship-city').value.trim();
            const shipState = document.getElementById('ship-state').value.trim();
            const shipPincode = document.getElementById('ship-pincode').value.trim();

            if (!shipName || !shipPhone || !shipAddress || !shipCity || !shipState || !shipPincode) {
                Toast.warning('Please complete all delivery destination fields');
                return;
            }

            const rawDeliveryMethod = document.querySelector('input[name="deliveryMethod"]:checked').value;
            const rawPaymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const notes = document.getElementById('order-notes').value.trim();

            const deliveryMethod = rawDeliveryMethod === 'FARM_PICKUP' ? 'Farm Pickup' : (rawDeliveryMethod === 'FARMER_DIRECT' ? 'Farmer Delivery' : 'CropLink Partner Delivery');
            const paymentMethod = rawPaymentMethod === 'COD' ? 'Cash on Delivery' : (rawPaymentMethod === 'UPI' ? 'UPI' : 'Card');
            const fullAddress = `${shipName} (${shipPhone}), ${shipAddress}, ${shipCity}, ${shipState} - ${shipPincode}${notes ? ' [Note: ' + notes + ']' : ''}`;

            const btn = document.getElementById('place-order-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Confirming Order...';

            try {
                // 1. Sync local cart items into backend database cart
                try {
                    await Api.delete('/api/customer/cart');
                } catch(e) {}

                for (const item of cart) {
                    await Api.post('/api/customer/cart', {
                        productId: item.id,
                        quantity: item.quantity
                    });
                }

                // 2. Place order via official backend endpoint
                const orderPayload = {
                    deliveryMethod,
                    paymentMethod,
                    deliveryAddress: fullAddress
                };

                const res = await Api.post('/api/customer/orders', orderPayload);
                const orderData = res.data || {};
                const generatedOrderId = orderData.id || ('CL-' + Math.floor(100000 + Math.random() * 900000));

                // 3. Store order in session for receipt display
                sessionStorage.setItem('last_croplink_order', JSON.stringify({
                    orderId: generatedOrderId,
                    items: cart,
                    total: subtotal + deliveryCost,
                    address: fullAddress,
                    deliveryMethod,
                    paymentMethod,
                    date: new Date().toLocaleString()
                }));

                // 4. Clear local cart
                Api.cart.clearCart();

                // 5. Redirect to success page
                Toast.success('Order placed successfully!');
                setTimeout(() => {
                    window.location.href = `/pages/order-success.html?orderId=${generatedOrderId}`;
                }, 800);

            } catch (err) {
                console.error('Order placement failed:', err);
                Toast.error(err.message || 'Failed to place order. Please check stock or login session.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-lock"></i> Place Secure Order';
            }
        });
    </script>
</body>
</html>
