# ===================================================
# CropLink — Farm-to-Door Delivery Platform
# Application Configuration (Local & Render Ready)
# ===================================================

spring.application.name=CropLink

# --- Server (Render dynamic port binding) ---
server.port=${PORT:8080}

# --- Database (Local fallback with cloud environment variable support) ---
# Supports DATABASE_URL / DB_URL from cloud providers (Aiven, Clever Cloud, PlanetScale, Render)
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:croplink_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${DB_USER:croplink}}
spring.datasource.password=${DB_PASSWORD:CropLink@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:CropLinkSecretKeyForJWTTokenGenerationThatIsLongEnough2024}
app.jwt.expiration-ms=86400000

# --- File Storage ---
app.storage.type=local
app.storage.local.upload-dir=uploads/products

# --- AWS S3 (optional fallback if configured) ---
app.storage.s3.bucket=${AWS_S3_BUCKET:croplink-products}
app.storage.s3.region=${AWS_REGION:ap-south-1}

# --- Logging ---
logging.level.com.croplink=INFO
logging.level.org.springframework.security=WARN
